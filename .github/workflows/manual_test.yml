name: Kur Takip - Manuel ve Günlük

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1-5"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: banka-kurlari-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium kur
        run: |
          python -m playwright install --with-deps chromium

      - name: Unit testleri çalıştır
        run: |
          python -m unittest discover -s tests -v

      - name: Kurları çek ve Excel oluştur
        run: |
          python main.py

      - name: Excel ve CSV dosyalarını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: banka-kurlari-${{ github.run_number }}
          path: |
            output/banka_kurlari.xlsx
            data/latest_rates.csv
            data/rates_history.csv
          if-no-files-found: error

      - name: Güncel verileri repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_rates.csv data/rates_history.csv output/banka_kurlari.xlsx
          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni değişiklik yok."
          else
            git commit -m "Günlük kur verisi: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
