name: Kur Takip - Günlük

on:
  workflow_dispatch:

  schedule:
    # Her gün Türkiye saatiyle 08:17.
    # Saat başı Actions yoğunluğundan kaçınmak için :17.
    - cron: "17 8 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: banka-kurlari-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium kur
        run: |
          python -m playwright install --with-deps chromium

      - name: Unit testleri çalıştır
        run: |
          python -m unittest discover -s tests -v

      - name: Kurları çek, geçmişe ekle ve Excel'i güncelle
        run: |
          python main.py

      - name: Excel ve CSV dosyalarını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          # Action geçmişinde yedek olarak kalır.
          # Ana kalıcı dosya yine output/banka_kurlari.xlsx'tir.
          name: banka-kurlari
          path: |
            output/banka_kurlari.xlsx
            data/latest_rates.csv
            data/rates_history.csv
          if-no-files-found: error
          retention-days: 30

      - name: Güncel verileri aynı repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/latest_rates.csv \
            data/rates_history.csv \
            output/banka_kurlari.xlsx

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Günlük kur verisi: $(TZ='Europe/Istanbul' date +'%d.%m.%Y %H:%M')"

          echo "Remote main kontrol ediliyor..."
          git fetch origin main

          echo "En güncel main üzerine rebase yapılıyor..."
          git rebase origin/main

          echo "Tek kalıcı geçmiş ve Excel repoya gönderiliyor..."
          git push origin HEAD:main
